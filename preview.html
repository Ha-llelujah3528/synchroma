<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>シンクローマ — SYNCHROMA（1ファイル版プレビュー）</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Shippori+Mincho:wght@700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --sky-top:#a6c8ff;--sky-mid:#ffd9a0;--sky-bot:#ffb7c5;--ink:#2b2440;--cream:#fff6ee;
  --c-magenta:#ff5d8f;--c-cyan:#43d6c4;--c-yellow:#ffd94a;
  --font-jp:"Noto Sans JP",system-ui,sans-serif;--font-mincho:"Shippori Mincho",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-jp);color:var(--ink);background:#1a1626;overflow:hidden;-webkit-font-smoothing:antialiased}
.title-screen{position:relative;width:100vw;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.sky{position:absolute;inset:0;background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 52%,var(--sky-bot) 100%);background-size:100% 140%;animation:skyShift 18s ease-in-out infinite alternate}
@keyframes skyShift{from{background-position:0 0%}to{background-position:0 40%}}
.sun-glow{position:absolute;left:50%;bottom:-28vmin;width:80vmin;height:80vmin;transform:translateX(-50%);background:radial-gradient(circle,rgba(255,255,230,.95) 0%,rgba(255,217,160,.55) 32%,rgba(255,183,197,0) 68%);filter:blur(2px);animation:sunPulse 6s ease-in-out infinite alternate}
@keyframes sunPulse{from{opacity:.75;transform:translateX(-50%) scale(1)}to{opacity:1;transform:translateX(-50%) scale(1.08)}}
.petals{position:absolute;inset:0;pointer-events:none}
.character{position:absolute;right:clamp(-40px,2vw,60px);bottom:0;height:min(92vh,760px);z-index:2;filter:drop-shadow(-8px 6px 18px rgba(43,36,64,.28));animation:charFloat 5.5s ease-in-out infinite alternate}
.character svg{height:100%;width:auto;display:block}
.character__badge{position:absolute;top:14px;left:14px;font-size:11px;font-weight:700;letter-spacing:.1em;color:#fff;background:rgba(43,36,64,.55);padding:4px 9px;border-radius:999px;backdrop-filter:blur(4px)}
@keyframes charFloat{from{transform:translateY(0)}to{transform:translateY(-14px)}}
.logo-wrap{position:relative;z-index:3;margin:clamp(40px,9vh,120px) 0 0 clamp(28px,7vw,130px);max-width:60%}
.logo{line-height:1}
.logo__jp{display:block;font-family:var(--font-mincho);font-weight:800;font-size:clamp(44px,8.5vw,110px);letter-spacing:.04em;color:var(--ink);text-shadow:0 2px 0 #fff,0 6px 18px rgba(43,36,64,.25);animation:logoIn 1s cubic-bezier(.2,.9,.25,1) both}
.logo__en{display:flex;gap:.04em;margin-top:.25em;margin-left:.1em;font-family:var(--font-mincho);font-weight:700;font-size:clamp(18px,3vw,40px);letter-spacing:.34em}
.logo__en span{background:linear-gradient(120deg,var(--c-magenta),var(--c-yellow),var(--c-cyan));background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:letterIn .6s cubic-bezier(.2,.9,.25,1) both,chromaFlow 7s linear infinite;animation-delay:calc(.5s + var(--i)*.06s),0s}
@keyframes chromaFlow{from{background-position:0 0}to{background-position:240% 0}}
@keyframes letterIn{from{opacity:0;transform:translateY(14px) rotate(-6deg)}to{opacity:1;transform:none}}
@keyframes logoIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.tagline{margin-top:1.1em;margin-left:.3em;font-size:clamp(13px,1.8vw,20px);font-weight:700;color:var(--ink);opacity:0;animation:fadeUp .8s ease 1.1s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:.85;transform:none}}
.menu{position:relative;z-index:3;margin:auto 0 clamp(36px,7vh,90px) clamp(28px,7vw,130px);display:flex;flex-direction:column;gap:14px;width:min(320px,70vw)}
.btn{position:relative;font-family:var(--font-jp);font-weight:700;font-size:18px;color:var(--ink);background:var(--cream);border:none;border-radius:16px;padding:16px 22px;text-align:left;cursor:pointer;box-shadow:0 6px 0 rgba(43,36,64,.12),0 10px 22px rgba(43,36,64,.18);transition:transform .12s ease,box-shadow .12s ease,background .2s ease;opacity:0;animation:fadeUp .6s ease forwards;overflow:hidden}
.btn:nth-child(1){animation-delay:1.3s}.btn:nth-child(2){animation-delay:1.42s}.btn:nth-child(3){animation-delay:1.54s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(43,36,64,.12),0 4px 10px rgba(43,36,64,.18)}
.btn--primary{display:flex;align-items:baseline;gap:12px;color:#fff;background:linear-gradient(120deg,var(--c-magenta),#ff7aa6);box-shadow:0 6px 0 #c43a68,0 12px 26px rgba(255,93,143,.45);animation:fadeUp .6s ease 1.3s forwards,btnPulse 2.4s ease-in-out 2s infinite}
.btn--primary:active{box-shadow:0 2px 0 #c43a68,0 4px 12px rgba(255,93,143,.45)}
.btn--primary .btn__sub{font-family:var(--font-mincho);font-size:13px;letter-spacing:.2em;opacity:.85}
@keyframes btnPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.credit{position:absolute;bottom:14px;right:18px;z-index:3;font-size:11px;color:var(--ink);opacity:.5}
.chroma-wipe{position:fixed;inset:0;z-index:50;display:flex;pointer-events:none}
.chroma-wipe span{flex:1;transform:scaleY(0);transform-origin:bottom}
.chroma-wipe span:nth-child(1){background:var(--c-magenta)}.chroma-wipe span:nth-child(2){background:var(--c-yellow)}.chroma-wipe span:nth-child(3){background:var(--c-cyan)}
.chroma-wipe.active span{animation:wipeUp .7s cubic-bezier(.7,0,.3,1) forwards}
.chroma-wipe.active span:nth-child(2){animation-delay:.08s}.chroma-wipe.active span:nth-child(3){animation-delay:.16s}
@keyframes wipeUp{0%{transform:scaleY(0);transform-origin:bottom}45%{transform:scaleY(1);transform-origin:bottom}55%{transform:scaleY(1);transform-origin:top}100%{transform:scaleY(0);transform-origin:top}}
.spark{position:fixed;width:10px;height:10px;border-radius:50%;z-index:40;pointer-events:none;animation:spark .6s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:640px){.character{opacity:.55;right:-60px}.logo-wrap{max-width:90%}.menu{width:min(360px,82vw)}}
</style>
</head>
<body>
<main class="title-screen">
  <div class="sky"></div>
  <div class="sun-glow"></div>
  <canvas class="petals" id="petals" aria-hidden="true"></canvas>

  <div class="character">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 760" role="img" aria-label="七海ひかり 仮立ち絵">
      <defs>
        <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5c97a"/><stop offset=".55" stop-color="#e0a85a"/><stop offset="1" stop-color="#c98842"/></linearGradient>
        <linearGradient id="hairTip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8fb4"/><stop offset="1" stop-color="#ff5d8f"/></linearGradient>
        <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e6"/><stop offset="1" stop-color="#ffe0cf"/></linearGradient>
        <linearGradient id="cardi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6ee"/><stop offset="1" stop-color="#ffe3ec"/></linearGradient>
        <radialGradient id="eyeL" cx=".5" cy=".35" r=".75"><stop offset="0" stop-color="#ff9ec0"/><stop offset=".5" stop-color="#ff5d8f"/><stop offset="1" stop-color="#9c2f56"/></radialGradient>
        <radialGradient id="blush" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff8fae" stop-opacity=".8"/><stop offset="1" stop-color="#ff8fae" stop-opacity="0"/></radialGradient>
      </defs>
      <path d="M150 250 C120 360 110 560 160 720 L360 720 C410 560 400 360 370 250 C360 180 300 120 260 120 C220 120 160 180 150 250 Z" fill="url(#hair)"/>
      <path d="M160 600 C150 660 158 700 170 720 L210 720 C200 660 196 620 196 600 Z" fill="url(#hairTip)" opacity=".9"/>
      <path d="M324 600 C330 660 326 700 320 720 L360 720 C356 660 352 620 352 600 Z" fill="url(#hairTip)" opacity=".9"/>
      <path d="M205 430 L315 430 L315 480 C390 500 420 580 420 720 L100 720 C100 580 130 500 205 480 Z" fill="url(#cardi)" stroke="#e9b7c6" stroke-width="3"/>
      <path d="M225 458 L260 540 L295 458 L315 478 L260 600 L205 478 Z" fill="#ffd1de"/>
      <path d="M232 405 L288 405 L288 460 L260 478 L232 460 Z" fill="url(#skin)"/>
      <path d="M185 245 C185 160 215 118 260 118 C305 118 335 160 335 245 C335 330 305 392 260 392 C215 392 185 330 185 245 Z" fill="url(#skin)"/>
      <path d="M175 250 C168 170 205 110 260 108 C315 110 352 170 345 250 C338 215 320 188 300 196 C306 168 292 150 274 148 C282 170 270 188 258 188 C252 168 236 158 224 168 C236 184 230 200 218 200 C214 184 196 188 190 210 C184 226 180 240 175 250 Z" fill="url(#hair)"/>
      <ellipse cx="212" cy="300" rx="26" ry="16" fill="url(#blush)"/>
      <ellipse cx="308" cy="300" rx="26" ry="16" fill="url(#blush)"/>
      <g>
        <path d="M196 270 C206 252 236 250 246 268 C238 296 206 298 196 270 Z" fill="#fff"/>
        <ellipse cx="222" cy="276" rx="17" ry="21" fill="url(#eyeL)"/>
        <circle cx="222" cy="278" r="8" fill="#3a1326"/>
        <circle cx="217" cy="270" r="5" fill="#fff"/>
        <path d="M222 264 l2 4 4 1 -4 1 -2 4 -2 -4 -4 -1 4 -1 Z" fill="#fff"/>
        <path d="M194 262 C208 250 240 248 250 262" fill="none" stroke="#5a2238" stroke-width="5" stroke-linecap="round"/>
      </g>
      <g>
        <path d="M274 268 C284 250 314 252 324 270 C314 298 282 296 274 268 Z" fill="#fff"/>
        <ellipse cx="298" cy="276" rx="17" ry="21" fill="url(#eyeL)"/>
        <circle cx="298" cy="278" r="8" fill="#3a1326"/>
        <circle cx="293" cy="270" r="5" fill="#fff"/>
        <path d="M298 264 l2 4 4 1 -4 1 -2 4 -2 -4 -4 -1 4 -1 Z" fill="#fff"/>
        <path d="M270 262 C280 248 312 250 326 262" fill="none" stroke="#5a2238" stroke-width="5" stroke-linecap="round"/>
      </g>
      <path d="M258 312 l6 8 -8 0 Z" fill="#f3b89c"/>
      <path d="M238 338 C252 352 272 352 286 338 C272 360 252 360 238 338 Z" fill="#c14a5e"/>
      <path d="M244 344 C256 350 268 350 280 344" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"/>
      <circle cx="186" cy="320" r="4" fill="#ffd94a"/>
    </svg>
    <span class="character__badge">仮ビジュアル</span>
  </div>

  <div class="logo-wrap">
    <h1 class="logo">
      <span class="logo__jp">シンクローマ</span>
      <span class="logo__en"><span style="--i:0">S</span><span style="--i:1">Y</span><span style="--i:2">N</span><span style="--i:3">C</span><span style="--i:4">H</span><span style="--i:5">R</span><span style="--i:6">O</span><span style="--i:7">M</span><span style="--i:8">A</span></span>
    </h1>
    <p class="tagline">色がシンクロする、放課後。</p>
  </div>

  <nav class="menu" id="menu">
    <button class="btn btn--primary" data-action="start"><span class="btn__label">はじめる</span><span class="btn__sub">START</span></button>
    <button class="btn" data-action="continue">つづきから</button>
    <button class="btn" data-action="settings">設定</button>
  </nav>

  <footer class="credit">© 彩明学園 シンクロ部 — プロトタイプ</footer>
  <div class="chroma-wipe" id="chromaWipe" aria-hidden="true"><span></span><span></span><span></span></div>
</main>
<script>
(()=>{"use strict";
const CHROMA=["#ff5d8f","#43d6c4","#ffd94a"];
const reduceMotion=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const canvas=document.getElementById("petals"),ctx=canvas.getContext("2d");
let petals=[];
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
function makePetal(){return{x:Math.random()*canvas.width,y:-20-Math.random()*canvas.height,r:6+Math.random()*8,sway:Math.random()*Math.PI*2,swaySpeed:.01+Math.random()*.02,vy:.4+Math.random()*.9,rot:Math.random()*Math.PI,vr:(Math.random()-.5)*.04,hue:Math.random()<.5?"#ffc2d4":"#ffd9e2"}}
function drawPetal(p){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.hue;ctx.globalAlpha=.85;ctx.beginPath();ctx.moveTo(0,-p.r);ctx.bezierCurveTo(p.r,-p.r,p.r,p.r,0,p.r);ctx.bezierCurveTo(-p.r,p.r,-p.r,-p.r,0,-p.r);ctx.fill();ctx.restore()}
function tick(){ctx.clearRect(0,0,canvas.width,canvas.height);for(const p of petals){p.sway+=p.swaySpeed;p.x+=Math.sin(p.sway)*.8;p.y+=p.vy;p.rot+=p.vr;if(p.y>canvas.height+30)Object.assign(p,makePetal(),{y:-20});drawPetal(p)}requestAnimationFrame(tick)}
function initPetals(){resize();const count=Math.min(46,Math.floor(window.innerWidth/28));petals=Array.from({length:count},makePetal);if(!reduceMotion)tick();else petals.forEach(drawPetal)}
window.addEventListener("resize",()=>{resize();if(reduceMotion){ctx.clearRect(0,0,canvas.width,canvas.height);petals.forEach(drawPetal)}});
initPetals();
function burst(x,y){if(reduceMotion)return;for(let i=0;i<14;i++){const s=document.createElement("span");s.className="spark";s.style.left=x+"px";s.style.top=y+"px";s.style.background=CHROMA[i%CHROMA.length];const a=Math.random()*Math.PI*2,d=40+Math.random()*70;s.style.setProperty("--dx",Math.cos(a)*d+"px");s.style.setProperty("--dy",Math.sin(a)*d+"px");document.body.appendChild(s);s.addEventListener("animationend",()=>s.remove())}}
const wipe=document.getElementById("chromaWipe");
function chromaTransition(after){if(reduceMotion){after&&after();return}wipe.classList.remove("active");void wipe.offsetWidth;wipe.classList.add("active");setTimeout(()=>after&&after(),420);setTimeout(()=>wipe.classList.remove("active"),760)}
const actions={start(){console.log("[SYNCHROMA] ゲーム開始へ（パズル盤面は次フェーズ）")},continue(){console.log("[SYNCHROMA] セーブ読込（未実装）")},settings(){console.log("[SYNCHROMA] 設定（未実装）")}};
document.getElementById("menu").addEventListener("click",e=>{const btn=e.target.closest(".btn");if(!btn)return;const r=btn.getBoundingClientRect();burst(e.clientX||r.left+r.width/2,e.clientY||r.top+r.height/2);const a=btn.dataset.action;chromaTransition(()=>actions[a]&&actions[a]())});
})();
</script>
</body>
</html>
